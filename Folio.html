<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Folio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: coluna única de 880px. Cronômetro em destaque, depois resumo, gráfico de evolução, livros e histórico. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --ink: #14171F;
  --muted: #5C6475;
  --line: #DCDFE6;
  --accent: #3B5BDB;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FB;
  --danger: #B4462B;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07080B; --surface: #0F1115; --ink: #E8EAF0; --muted: #8D93A3; --line: #1E222B;
    --accent: #7C9CFF; --accent-ink: #0A1230; --accent-soft: #19213D; --danger: #F08A6B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07080B; --surface: #0F1115; --ink: #E8EAF0; --muted: #8D93A3; --line: #1E222B;
  --accent: #7C9CFF; --accent-ink: #0A1230; --accent-soft: #19213D; --danger: #F08A6B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 20px; }
.wrap > * { min-width: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 21px; line-height: 1.2; }
.top { display: flex; gap: 12px 20px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.top p { margin: 4px 0 0; color: var(--muted); }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; background: var(--surface); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 18px; font-weight: 500; cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%; }

.brand { display: flex; align-items: center; gap: 12px; }
.wordmark { display: flex; align-items: flex-end; gap: 3px; margin: 0; padding: 0 6px; border-bottom: 4px solid var(--ink); border-radius: 2px; width: max-content; max-width: 100%; }
.spine { display: grid; place-items: center; font: 600 30px/1 var(--font-display); letter-spacing: 0; border-radius: 3px 3px 0 0; position: relative; flex: none; }
.spine::before, .spine::after { content: ""; position: absolute; left: 4px; right: 4px; height: 2px; border-radius: 1px; background: currentColor; opacity: 0.55; }
.spine::before { top: 7px; }
.spine::after { bottom: 7px; }
.s1 { width: 40px; height: 62px; background: var(--accent); color: var(--accent-ink); }
.s2 { width: 38px; height: 52px; background: var(--ink); color: var(--bg); }
.s3 { width: 28px; height: 68px; background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.s4 { width: 28px; height: 56px; background: var(--muted); color: var(--bg); }
.s5 { width: 40px; height: 60px; background: var(--accent); color: var(--accent-ink); transform: rotate(7deg); transform-origin: 0 100%; margin-left: 6px; margin-right: 8px; }
.tools { display: flex; align-items: center; gap: 8px; }
.theme { appearance: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.theme:hover { border-color: var(--accent); color: var(--accent); }
.theme svg { width: 18px; height: 18px; display: block; }
.theme .sun { display: none; }
:root[data-theme="dark"] .theme .sun { display: block; }
:root[data-theme="dark"] .theme .moon { display: none; }

/* Cronômetro */
.timer { display: grid; gap: 18px; }
.timer-head { display: grid; grid-template-columns: 1fr; gap: 6px; }
.clock { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.digits { font: 500 clamp(44px, 12vw, 76px)/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.running .dot { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .running .dot { animation: none; } }
.state { color: var(--muted); font-size: 13px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
.finish { border-top: 1px dashed var(--line); padding-top: 18px; display: grid; gap: 14px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row .field { flex: 1 1 140px; }

/* Resumo */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font: 600 28px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span.sub { color: var(--muted); font-size: 13px; }

/* Gráfico */
.chart-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; }
.chart-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.controls-right { display: flex; gap: 8px; flex-wrap: wrap; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 230px; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font: 11px var(--font-body); }
.chart .bar { fill: var(--accent); }
.chart .bar.hot { filter: brightness(1.18); }
.chart .zero { stroke: var(--line); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
.tip b { font-weight: 600; }
.empty { color: var(--muted); padding: 26px 8px; text-align: center; }

/* Listas */
.list { display: grid; margin-top: 10px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.item .r { grid-row: span 2; grid-column: 2; text-align: right; }
.pace { font-variant-numeric: tabular-nums; font-weight: 500; }
details.manual summary { cursor: pointer; font-weight: 500; color: var(--accent); min-height: 32px; display: flex; align-items: center; }
details.manual form { margin-top: 12px; display: grid; gap: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 5; max-width: calc(100% - 32px); }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">
        <h1 class="wordmark" aria-label="Folio">
          <span class="spine s1" aria-hidden="true">F</span><span class="spine s2" aria-hidden="true">o</span><span class="spine s3" aria-hidden="true">l</span><span class="spine s4" aria-hidden="true">i</span><span class="spine s5" aria-hidden="true">o</span>
        </h1>
      </div>
      <p>Seu diário de leitura: cronometre cada sessão, registre as páginas e acompanhe sua evolução.</p>
    </div>
    <div class="tools">
      <span class="chip" id="status">Conectando…</span>
      <button class="theme" id="theme" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="panel timer" id="timer" aria-label="Cronômetro de leitura">
    <div class="timer-head">
      <div class="field">
        <label class="label" for="book">Livro</label>
        <input id="book" list="books" placeholder="Título do livro que você está lendo" autocomplete="off" maxlength="120">
        <datalist id="books"></datalist>
      </div>
    </div>
    <div class="clock">
      <span class="dot" aria-hidden="true"></span>
      <span class="digits" id="digits" role="timer" aria-live="off">00:00:00</span>
      <span class="state" id="tstate">Pronto para começar</span>
    </div>
    <div class="controls">
      <button class="btn primary" id="toggle" type="button">Iniciar leitura</button>
      <button class="btn" id="stop" type="button" disabled>Encerrar</button>
    </div>
    <form class="finish" id="finish" hidden>
      <div class="row">
        <div class="field">
          <label class="label" for="pages">Páginas lidas</label>
          <input id="pages" type="number" min="0" max="5000" step="1" inputmode="numeric" placeholder="Ex.: 18" required>
        </div>
        <div class="field">
          <span class="label">Tempo da sessão</span>
          <span class="pace" id="fdur" style="min-height:44px;display:flex;align-items:center"></span>
        </div>
      </div>
      <div class="controls">
        <button class="btn primary" type="submit">Salvar leitura</button>
        <button class="btn" type="button" id="resume">Continuar lendo</button>
        <button class="btn danger" type="button" id="discard">Descartar</button>
      </div>
    </form>
  </section>

  <section class="stats" id="stats" aria-label="Resumo"></section>

  <section class="panel">
    <div class="chart-head">
      <div>
        <h2>Evolução</h2>
        <p id="chartsum"></p>
      </div>
      <div class="controls-right">
        <div class="seg" role="group" aria-label="Métrica">
          <button type="button" data-metric="pages" aria-pressed="true">Páginas</button>
          <button type="button" data-metric="minutes" aria-pressed="false">Minutos</button>
        </div>
        <div class="seg" role="group" aria-label="Período">
          <button type="button" data-range="7" aria-pressed="false">7 dias</button>
          <button type="button" data-range="14" aria-pressed="true">14 dias</button>
          <button type="button" data-range="30" aria-pressed="false">30 dias</button>
        </div>
      </div>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="panel">
    <h2>Meus livros</h2>
    <div class="list" id="booklist"></div>
  </section>

  <section class="panel">
    <h2>Histórico</h2>
    <div class="list" id="history"></div>
    <div style="margin-top:12px" id="morewrap"></div>
  </section>

  <section class="panel">
    <details class="manual">
      <summary>Esqueci de cronometrar: adicionar leitura manual</summary>
      <form id="manual">
        <div class="row">
          <div class="field"><label class="label" for="m-date">Data</label><input id="m-date" type="date" required></div>
          <div class="field"><label class="label" for="m-book">Livro</label><input id="m-book" list="books" maxlength="120" required></div>
        </div>
        <div class="row">
          <div class="field"><label class="label" for="m-min">Minutos</label><input id="m-min" type="number" min="1" max="1440" inputmode="numeric" required></div>
          <div class="field"><label class="label" for="m-pages">Páginas</label><input id="m-pages" type="number" min="0" max="5000" inputmode="numeric" required></div>
        </div>
        <div><button class="btn primary" type="submit">Adicionar</button></div>
      </form>
    </details>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var dayKey = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var parseKey = function (k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function fmtDur(sec) {
    sec = Math.round(sec);
    if (sec < 60) return sec + " s";
    var m = Math.round(sec / 60), h = Math.floor(m / 60);
    if (h === 0) return m + " min";
    return h + "h " + pad(m % 60) + "min";
  }
  function fmtDate(k) {
    var d = parseKey(k), t = dayKey(new Date()), y = new Date(); y.setDate(y.getDate() - 1);
    if (k === t) return "Hoje";
    if (k === dayKey(y)) return "Ontem";
    return d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" }).replace(".", "");
  }
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3200);
  }

  /* ---------- Dados ---------- */
  var sessions = [];
  var backend = { kind: "local", col: null };
  var SKEY = "diario-leitura-sessoes";

  function loadLocal() {
    try { sessions = JSON.parse(LS.get(SKEY) || "[]"); } catch (e) { sessions = []; }
  }
  function saveLocal() { LS.set(SKEY, JSON.stringify(sessions)); }
  function setStatus() {
    $("#status").textContent = backend.kind === "db" ? "Salvo na sua conta" : "Salvo só neste navegador";
  }

  async function addSession(s) {
    var id = "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var doc = { date: s.date, book: s.book, seconds: s.seconds, pages: s.pages, createdAt: Date.now() };
    if (backend.kind === "db") {
      try { await backend.col.doc(id).set(doc); return true; }
      catch (e) { toast("Não foi possível salvar na conta. Tente de novo."); return false; }
    }
    sessions.push(Object.assign({ id: id }, doc)); saveLocal(); render(); return true;
  }
  async function removeSession(id) {
    if (backend.kind === "db") {
      try { await backend.col.doc(id).delete(); } catch (e) { toast("Não foi possível apagar."); }
      return;
    }
    sessions = sessions.filter(function (s) { return s.id !== id; }); saveLocal(); render();
  }

  async function connect() {
    loadLocal(); setStatus(); render();
    try {
      if (!window.claude || !window.claude.use) return;
      var db = await window.claude.use("db");
      var user = await window.claude.use("user");
      var uid = user && (await user.id());
      if (!db || !uid) return;
      var col = db.collection("data/users/" + uid);
      backend = { kind: "db", col: col };
      var local = sessions.slice();
      col.onSnapshot(function (snap) {
        sessions = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        setStatus(); render();
        migrate(local, snap);
      }, function () {
        backend = { kind: "local", col: null }; loadLocal(); setStatus(); render();
      });
    } catch (e) { /* segue com armazenamento local */ }
  }
  var migrated = false;
  async function migrate(local, snap) {
    if (migrated) return; migrated = true;
    if (!local.length || !snap.empty) return;
    for (var i = 0; i < local.length; i++) {
      var s = local[i];
      try { await backend.col.doc(s.id).set({ date: s.date, book: s.book, seconds: s.seconds, pages: s.pages, createdAt: s.createdAt || Date.now() }); } catch (e) { return; }
    }
    LS.set(SKEY, "[]");
    toast("Suas leituras deste navegador foram para a conta.");
  }

  /* ---------- Cronômetro ---------- */
  var TKEY = "diario-leitura-timer";
  var T = { book: "", startedAt: null, acc: 0, finishing: false };
  try { var raw = JSON.parse(LS.get(TKEY) || "null"); if (raw) T = Object.assign(T, raw); } catch (e) {}
  var wake = null;
  function persistT() { LS.set(TKEY, JSON.stringify(T)); }
  function elapsed() { return T.acc + (T.startedAt ? Date.now() - T.startedAt : 0); }
  function hms(ms) {
    var s = Math.floor(ms / 1000);
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }
  async function lockScreen(on) {
    try {
      if (on && navigator.wakeLock && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen");
      else if (!on && wake) { await wake.release(); wake = null; }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (T.startedAt && document.visibilityState === "visible") lockScreen(true); });

  function paintTimer() {
    var ms = elapsed(), running = !!T.startedAt;
    $("#digits").textContent = hms(ms);
    $("#timer").classList.toggle("running", running);
    $("#toggle").textContent = running ? "Pausar" : ms > 0 ? "Retomar" : "Iniciar leitura";
    $("#stop").disabled = ms < 1000 || T.finishing;
    $("#toggle").disabled = T.finishing;
    $("#tstate").textContent = running ? "Lendo agora" : T.finishing ? "Sessão encerrada" : ms > 0 ? "Pausado" : "Pronto para começar";
    $("#finish").hidden = !T.finishing;
    if (T.finishing) $("#fdur").textContent = fmtDur(ms / 1000);
  }
  setInterval(function () { if (T.startedAt) paintTimer(); }, 250);

  $("#book").value = T.book || LS.get("diario-leitura-ultimo") || "";
  $("#book").addEventListener("input", function () { T.book = this.value; persistT(); });
  $("#toggle").addEventListener("click", function () {
    if (T.startedAt) { T.acc += Date.now() - T.startedAt; T.startedAt = null; lockScreen(false); }
    else { T.startedAt = Date.now(); lockScreen(true); }
    persistT(); paintTimer();
  });
  $("#stop").addEventListener("click", function () {
    if (T.startedAt) { T.acc += Date.now() - T.startedAt; T.startedAt = null; lockScreen(false); }
    T.finishing = true; persistT(); paintTimer();
    $("#pages").focus();
  });
  $("#resume").addEventListener("click", function () { T.finishing = false; persistT(); paintTimer(); });
  var discardArmed = false;
  $("#discard").addEventListener("click", function () {
    var b = this;
    if (!discardArmed) { discardArmed = true; b.textContent = "Confirmar descarte"; setTimeout(function () { discardArmed = false; b.textContent = "Descartar"; }, 3000); return; }
    discardArmed = false; b.textContent = "Descartar";
    T = { book: $("#book").value, startedAt: null, acc: 0, finishing: false }; persistT(); paintTimer();
  });
  $("#finish").addEventListener("submit", async function (e) {
    e.preventDefault();
    var book = $("#book").value.trim();
    if (!book) { toast("Informe o livro antes de salvar."); $("#book").focus(); return; }
    var pages = Math.max(0, Math.round(+$("#pages").value || 0));
    var secs = Math.round(elapsed() / 1000);
    var ok = await addSession({ date: dayKey(new Date()), book: book, seconds: secs, pages: pages });
    if (!ok) return;
    LS.set("diario-leitura-ultimo", book);
    T = { book: book, startedAt: null, acc: 0, finishing: false }; persistT();
    $("#pages").value = ""; paintTimer();
    toast("Leitura salva: " + pages + " páginas em " + fmtDur(secs) + ".");
  });

  /* ---------- Manual ---------- */
  $("#m-date").value = dayKey(new Date());
  $("#m-date").max = dayKey(new Date());
  $("#manual").addEventListener("submit", async function (e) {
    e.preventDefault();
    var ok = await addSession({
      date: $("#m-date").value, book: $("#m-book").value.trim(),
      seconds: Math.round(+$("#m-min").value * 60), pages: Math.round(+$("#m-pages").value)
    });
    if (ok) { $("#m-min").value = ""; $("#m-pages").value = ""; toast("Leitura adicionada."); }
  });

  /* ---------- Cálculos ---------- */
  function byDay() {
    var m = {};
    sessions.forEach(function (s) {
      var o = m[s.date] || (m[s.date] = { pages: 0, seconds: 0 });
      o.pages += s.pages || 0; o.seconds += s.seconds || 0;
    });
    return m;
  }
  function streak(m) {
    var d = new Date();
    if (!m[dayKey(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (m[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function plural(n, a, b) { return n + " " + (n === 1 ? a : b); }

  /* ---------- Render ---------- */
  var metric = "pages", range = 14, showAll = false, armedDelete = null;

  function renderStats() {
    var m = byDay(), today = m[dayKey(new Date())] || { pages: 0, seconds: 0 };
    var p30 = 0, s30 = 0, d = new Date();
    for (var i = 0; i < 30; i++) { var o = m[dayKey(d)]; if (o) { p30 += o.pages; s30 += o.seconds; } d.setDate(d.getDate() - 1); }
    var st = streak(m);
    var pace = s30 > 0 ? (p30 / (s30 / 3600)) : 0;
    var html = [
      ["Hoje", plural(today.pages, "página", "páginas"), fmtDur(today.seconds)],
      ["Sequência", plural(st, "dia", "dias"), st ? "lendo em dias seguidos" : "leia hoje para começar"],
      ["Últimos 30 dias", plural(p30, "página", "páginas"), fmtDur(s30) + " de leitura"],
      ["Ritmo médio", pace ? pace.toFixed(1).replace(".", ",") + " pág/h" : "—", "nos últimos 30 dias"]
    ].map(function (x) { return '<div class="stat"><span class="label">' + x[0] + '</span><b>' + x[1] + '</b><span class="sub">' + x[2] + '</span></div>'; }).join("");
    $("#stats").innerHTML = html;
  }

  function niceMax(v) {
    var raw = Math.max(v, 1) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    var step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
    return { step: step, max: step * 4 };
  }

  var chartData = [];
  function renderChart() {
    var m = byDay(), days = [], d = new Date();
    for (var i = 0; i < range; i++) { days.unshift(dayKey(d)); d.setDate(d.getDate() - 1); }
    chartData = days.map(function (k) {
      var o = m[k] || { pages: 0, seconds: 0 };
      return { k: k, pages: o.pages, minutes: Math.round(o.seconds / 60) };
    });
    var vals = chartData.map(function (x) { return x[metric]; });
    var total = vals.reduce(function (a, b) { return a + b; }, 0);
    var unit = metric === "pages" ? "páginas" : "minutos";
    $("#chartsum").textContent = total ? total + " " + unit + " em " + range + " dias · média de " + (total / range).toFixed(1).replace(".", ",") + " por dia" : "Nenhuma leitura neste período.";
    var wrap = $("#chart");
    if (!sessions.length) { wrap.innerHTML = '<div class="empty">Seu gráfico aparece aqui depois da primeira leitura. Inicie o cronômetro acima ou adicione uma leitura manual.</div>'; return; }
    var W = Math.max(wrap.clientWidth, 280), H = 230, L = 34, R = 6, Tp = 10, B = 26;
    var nm = niceMax(Math.max.apply(null, vals)), iw = W - L - R, ih = H - Tp - B, bw = iw / range;
    var barW = Math.min(bw * 0.7, 30), svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico de ' + unit + ' por dia">';
    for (var t = 0; t <= 4; t++) {
      var y = Tp + ih - (t / 4) * ih, v = t * nm.step;
      svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text class="tick" x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>';
    }
    var step = range <= 7 ? 1 : range <= 14 ? (W < 420 ? 2 : 1) : 5;
    chartData.forEach(function (c, i) {
      var cx = L + bw * i + bw / 2, h = (c[metric] / nm.max) * ih, x = cx - barW / 2, y = Tp + ih - h, r = Math.min(4, barW / 2, h);
      if (c[metric] > 0) {
        svg += '<path class="bar" data-i="' + i + '" d="M' + x + ',' + (Tp + ih) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + barW - r) + 'Q' + (x + barW) + ',' + y + ' ' + (x + barW) + ',' + (y + r) + 'V' + (Tp + ih) + 'Z"/>';
      } else {
        svg += '<line class="zero" x1="' + (cx - 4) + '" x2="' + (cx + 4) + '" y1="' + (Tp + ih - 1) + '" y2="' + (Tp + ih - 1) + '"/>';
      }
      if ((range - 1 - i) % step === 0) {
        var dt = parseKey(c.k), lab = range <= 7 ? dt.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "") : String(dt.getDate());
        svg += '<text class="tick" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + lab + '</text>';
      }
    });
    svg += '</svg><div class="tip" id="tip" hidden></div>';
    wrap.innerHTML = svg;
    var el = wrap.querySelector("svg"), tip = $("#tip");
    function show(ev) {
      var rect = el.getBoundingClientRect(), x = (ev.clientX - rect.left) * (W / rect.width);
      var i = Math.floor((x - L) / bw);
      wrap.querySelectorAll(".bar.hot").forEach(function (b) { b.classList.remove("hot"); });
      if (i < 0 || i >= range) { tip.hidden = true; return; }
      var c = chartData[i], bar = wrap.querySelector('.bar[data-i="' + i + '"]'); if (bar) bar.classList.add("hot");
      var cx = (L + bw * i + bw / 2) * (rect.width / W), h = (c[metric] / nm.max) * ih;
      tip.innerHTML = "<b>" + fmtDate(c.k) + " · " + parseKey(c.k).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + "</b><br>" + c.pages + " pág · " + c.minutes + " min";
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(cx, 60), rect.width - 60) + "px";
      tip.style.top = Math.max((Tp + ih - h) * (rect.height / H) - 6, 34) + "px";
    }
    el.addEventListener("pointermove", show); el.addEventListener("pointerdown", show);
    el.addEventListener("pointerleave", function () { tip.hidden = true; wrap.querySelectorAll(".bar.hot").forEach(function (b) { b.classList.remove("hot"); }); });
  }

  function renderBooks() {
    var map = {};
    sessions.forEach(function (s) {
      var b = map[s.book] || (map[s.book] = { name: s.book, pages: 0, seconds: 0, n: 0, last: "" });
      b.pages += s.pages || 0; b.seconds += s.seconds || 0; b.n++; if (s.date > b.last) b.last = s.date;
    });
    var list = Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return a.last < b.last ? 1 : -1; });
    $("#books").innerHTML = list.map(function (b) { return '<option value="' + esc(b.name) + '"></option>'; }).join("");
    $("#booklist").innerHTML = list.length ? list.map(function (b) {
      var pace = b.seconds ? (b.pages / (b.seconds / 3600)).toFixed(1).replace(".", ",") + " pág/h" : "—";
      return '<div class="item"><span class="t">' + esc(b.name) + '</span><span class="r pace">' + b.pages + ' pág</span><span class="m">' + plural(b.n, "sessão", "sessões") + ' · ' + fmtDur(b.seconds) + ' · ' + pace + '</span></div>';
    }).join("") : '<div class="empty">Os livros aparecem aqui conforme você registra leituras.</div>';
  }

  function renderHistory() {
    var list = sessions.slice().sort(function (a, b) { return a.date === b.date ? (b.createdAt || 0) - (a.createdAt || 0) : a.date < b.date ? 1 : -1; });
    var shown = showAll ? list : list.slice(0, 10);
    $("#history").innerHTML = shown.length ? shown.map(function (s) {
      var armed = armedDelete === s.id;
      return '<div class="item"><span class="t">' + esc(s.book) + '</span><span class="r"><button class="btn small' + (armed ? ' danger' : '') + '" data-del="' + esc(s.id) + '" type="button">' + (armed ? 'Confirmar' : 'Apagar') + '</button></span><span class="m">' + fmtDate(s.date) + ' · ' + s.pages + ' pág · ' + fmtDur(s.seconds) + '</span></div>';
    }).join("") : '<div class="empty">Nenhuma leitura registrada ainda.</div>';
    $("#morewrap").innerHTML = list.length > 10 ? '<button class="btn small" id="more" type="button">' + (showAll ? "Mostrar menos" : "Mostrar tudo (" + list.length + ")") + '</button>' : "";
  }

  function render() { renderStats(); renderChart(); renderBooks(); renderHistory(); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.metric) { metric = b.dataset.metric; document.querySelectorAll("[data-metric]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); renderChart(); }
    else if (b.dataset.range) { range = +b.dataset.range; document.querySelectorAll("[data-range]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); renderChart(); }
    else if (b.dataset.del) {
      if (armedDelete === b.dataset.del) { var id = armedDelete; armedDelete = null; removeSession(id); }
      else { armedDelete = b.dataset.del; renderHistory(); setTimeout(function () { if (armedDelete) { armedDelete = null; renderHistory(); } }, 3000); }
    }
    else if (b.id === "more") { showAll = !showAll; renderHistory(); }
  });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(renderChart, 120); });

  /* ---------- Tema ---------- */
  var root = document.documentElement;
  function isDark() {
    var a = root.getAttribute("data-theme");
    return a ? a === "dark" : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  }
  var savedTheme = LS.get("folio-tema");
  if (savedTheme === "dark" || savedTheme === "light") root.setAttribute("data-theme", savedTheme);
  $("#theme").addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next); LS.set("folio-tema", next);
    if (next === "light") root.style.colorScheme = "light"; else root.style.colorScheme = "dark";
  });
  if (savedTheme === "dark") root.style.colorScheme = "dark";

  paintTimer();
  if (T.startedAt) lockScreen(true);
  connect();
})();
</script>

</body></html>
